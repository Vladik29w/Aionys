services:
  db:
    image: postgres:17-alpine
    environment:
      # Public demo credentials for local use only.
      POSTGRES_DB: Notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: "Notes_Local_2026!"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h localhost -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  server:
    build:
      context: ./Server
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=Notes;Username=notes;Password=Notes_Local_2026!"
    ports:
      - "127.0.0.1:5203:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./Client
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres-data:
