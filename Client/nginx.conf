server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Re-resolve the API name so a restarted API with a
    # new container IP is picked up without recreating Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Strip /api/ before forwarding to the ASP.NET endpoints.
    location /api/ {
        set $api_upstream http://server:8080;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # not index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # caching
    location ~* \.(?:js|css|woff2?|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
